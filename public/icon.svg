<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa3b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="18" filter="url(#shadow)"/>
  
  <!-- Burger Illustration -->
  <g transform="translate(96, 110) scale(1.25)">
    <!-- Top Bun -->
    <path d="M 20 110 C 20 40, 236 40, 236 110 Z" fill="#f6ad55" stroke="#2d3748" stroke-width="8" stroke-linejoin="round"/>
    <!-- Sesame Seeds -->
    <ellipse cx="80" cy="70" rx="6" ry="3" fill="#fefcbf" transform="rotate(-15 80 70)"/>
    <ellipse cx="128" cy="58" rx="6" ry="3" fill="#fefcbf"/>
    <ellipse cx="176" cy="70" rx="6" ry="3" fill="#fefcbf" transform="rotate(15 176 70)"/>
    <ellipse cx="105" cy="85" rx="5" ry="3" fill="#fefcbf"/>
    <ellipse cx="150" cy="85" rx="5" ry="3" fill="#fefcbf"/>

    <!-- Lettuce Layer -->
    <path d="M 12 110 Q 30 130 55 112 Q 80 132 105 112 Q 130 132 155 112 Q 180 132 205 112 Q 230 132 244 110 L 244 122 Q 225 142 205 124 Q 180 144 155 124 Q 130 144 105 124 Q 80 144 55 124 Q 30 144 12 122 Z" fill="#48bb78" stroke="#1a202c" stroke-width="7"/>

    <!-- Tomato Slice -->
    <rect x="22" y="124" width="212" height="18" rx="9" fill="#e53e3e" stroke="#1a202c" stroke-width="7"/>

    <!-- Melted Cheese -->
    <path d="M 16 142 L 240 142 L 225 162 L 180 152 L 140 178 L 105 152 L 65 174 L 32 152 Z" fill="#ecc94b" stroke="#1a202c" stroke-width="7" stroke-linejoin="round"/>

    <!-- Meat Patty -->
    <rect x="16" y="152" width="224" height="34" rx="16" fill="#744210" stroke="#1a202c" stroke-width="8"/>

    <!-- Bottom Bun -->
    <path d="M 22 186 L 234 186 C 234 222, 22 222, 22 186 Z" fill="#dd6b20" stroke="#1a202c" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
